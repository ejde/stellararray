<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar Array — How It Works: A Step-by-Step Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #111;
            --border: #222;
            --text: #e0e0e0;
            --muted: #666;
            --accent: #00ff41;
            --accent-dim: #00cc33;
            --warn: #ffcc00;
            --info: #4da6ff;
            --danger: #ff4444;
            --calc0: #4da6ff;
            --calc1: #00ff41;
            --calc2: #ffcc00;
            --agg: #ff00ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            min-height: 100vh;
        }
        h1, h2, h3, .mono { font-family: 'Courier Prime', monospace; }
        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px 80px; }
        
        /* Header */
        header { text-align: center; margin-bottom: 60px; padding-bottom: 40px; border-bottom: 1px solid var(--border); }
        header h1 { color: var(--accent); font-size: clamp(2rem, 5vw, 3rem); letter-spacing: 4px; margin-bottom: 12px; }
        header p { color: var(--muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }
        
        /* Progress */
        .progress { position: sticky; top: 0; background: rgba(10,10,10,0.95); backdrop-filter: blur(10px); 
            border-bottom: 1px solid var(--border); padding: 12px 0; margin: 0 -20px 40px; z-index: 100; }
        .progress-bar { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--calc0), var(--calc1), var(--calc2), var(--agg)); 
            width: 0%; transition: width 0.4s ease; }
        .progress-labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.7rem; color: var(--muted); }
        .progress-labels span.active { color: var(--accent); font-weight: 600; }
        
        /* Step Cards */
        .step { background: var(--card); border: 1px solid var(--border); border-radius: 12px; 
            padding: 40px; margin-bottom: 30px; opacity: 0; transform: translateY(20px); 
            animation: fadeUp 0.6s ease forwards; }
        .step:nth-child(1) { animation-delay: 0.1s; }
        .step:nth-child(2) { animation-delay: 0.2s; }
        .step:nth-child(3) { animation-delay: 0.3s; }
        .step:nth-child(4) { animation-delay: 0.4s; }
        .step:nth-child(5) { animation-delay: 0.5s; }
        .step:nth-child(6) { animation-delay: 0.6s; }
        .step:nth-child(7) { animation-delay: 0.7s; }
        .step:nth-child(8) { animation-delay: 0.8s; }
        @keyframes fadeUp { to { opacity: 1; transform: none; } }
        
        .step-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
        .step-number { background: var(--accent); color: #000; font-weight: 700; padding: 8px 16px; 
            border-radius: 6px; font-size: 1rem; min-width: 50px; text-align: center; }
        .step-title { color: var(--warn); font-size: 1.3rem; letter-spacing: 1px; }
        .step-phase { background: #001100; border: 1px solid var(--accent); color: var(--accent); 
            padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; margin-left: auto; }
        
        .step-content { display: grid; grid-template-columns: 1fr; gap: 24px; }
        @media (min-width: 700px) { .step-content { grid-template-columns: 1.2fr 1fr; } }
        
        .explanation h3 { color: var(--text); margin-bottom: 12px; font-size: 1rem; }
        .explanation p { color: var(--muted); margin-bottom: 12px; }
        .explanation .key-point { background: #001100; border-left: 3px solid var(--accent); 
            padding: 12px 16px; margin: 16px 0; font-size: 0.9rem; }
        .explanation .key-point strong { color: var(--accent); }
        .explanation ul { margin: 12px 0 12px 24px; color: var(--muted); }
        .explanation li { margin: 6px 0; }
        .explanation code { background: #000; color: var(--calc1); padding: 2px 6px; border-radius: 3px; font-size: 0.85em; }
        
        /* Visual Panel */
        .visual-panel { background: #000; border: 1px solid var(--border); border-radius: 8px; 
            padding: 20px; min-height: 200px; position: relative; }
        .visual-panel h4 { color: var(--info); font-size: 0.8rem; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Tape Visualization */
        .tape-viz { display: flex; flex-direction: column; gap: 4px; font-family: 'Courier Prime', monospace; font-size: 0.75rem; }
        .tape-block { padding: 12px; background: #111; border: 1px solid #333; border-radius: 4px; }
        .tape-block-label { color: var(--muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .tape-row { display: flex; gap: 4px; flex-wrap: wrap; }
        .tape-cell { background: #000; border: 1px solid #222; padding: 4px 8px; min-width: 50px; text-align: center; color: #888; }
        .tape-cell.active { background: #1a2a1a; border-color: var(--accent); color: var(--accent); font-weight: bold; }
        .tape-cell.baseline { color: var(--calc0); }
        .tape-cell.current { color: var(--calc2); }
        .tape-arrow { text-align: center; color: var(--accent); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
        
        /* Architecture Diagram */
        .arch-flow { display: flex; flex-direction: column; gap: 12px; align-items: center; }
        .arch-layer { width: 100%; background: #111; border: 1px solid #222; border-radius: 6px; padding: 16px; text-align: center; transition: all 0.3s; }
        .arch-layer.active { border-color: var(--accent); box-shadow: 0 0 20px rgba(0,255,65,0.1); background: #0a1a0a; }
        .arch-layer-label { color: var(--muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .arch-layer-content { font-family: 'Courier Prime', monospace; font-size: 0.8rem; color: var(--text); }
        .arch-layer .calc-stripe { display: inline-block; background: #000; border: 1px solid #333; padding: 4px 12px; margin: 4px; border-radius: 4px; font-size: 0.7rem; }
        .arch-layer .stripe-0 { border-color: var(--calc0); color: var(--calc0); }
        .arch-layer .stripe-1 { border-color: var(--calc1); color: var(--calc1); }
        .arch-layer .stripe-2 { border-color: var(--calc2); color: var(--calc2); }
        .arch-layer .aggregator { border-color: var(--agg); color: var(--agg); background: #1a001a; }
        .arch-arrow { color: var(--accent); font-size: 1.5rem; animation: bounce 1s infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
        
        /* Grid Visualization */
        .grid-viz { display: grid; grid-template-columns: repeat(15, 1fr); gap: 2px; background: #000; padding: 8px; border-radius: 4px; }
        .grid-cell { aspect-ratio: 1; background: #111; border: 1px solid #222; display: flex; align-items: center; justify-content: center; font-family: 'Courier Prime', monospace; font-size: 0.6rem; color: #444; transition: all 0.2s; }
        .grid-cell.filled { background: #1a1a1a; color: #888; border-color: #333; }
        .grid-cell.computing { background: var(--warn); color: #000; font-weight: bold; transform: scale(1.1); z-index: 1; }
        .grid-cell.signal { background: #003300; color: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 8px rgba(0,255,65,0.4); }
        .grid-row-label { grid-column: 1 / -1; color: var(--muted); font-size: 0.6rem; padding: 4px; text-align: center; }
        .grid-stripe-0 .grid-cell.filled { border-left: 2px solid var(--calc0); }
        .grid-stripe-1 .grid-cell.filled { border-left: 2px solid var(--calc1); }
        .grid-stripe-2 .grid-cell.filled { border-left: 2px solid var(--calc2); }
        
        /* Calculator Registers */
        .regs-viz { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; font-family: monospace; font-size: 0.65rem; }
        .reg-cell { background: #000; border: 1px solid #111; padding: 4px; text-align: center; color: #333; }
        .reg-cell.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .regs-header { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
        .calc-badge { padding: 4px 10px; border-radius: 4px; font-size: 0.65rem; font-weight: bold; color: #000; }
        .calc-badge.c0 { background: var(--calc0); }
        .calc-badge.c1 { background: var(--calc1); }
        .calc-badge.c2 { background: var(--calc2); }
        .calc-badge.agg { background: var(--agg); }
        
        /* Thyratron Panel */
        .thyratron-grid { display: grid; grid-template-columns: repeat(15, 1fr); gap: 2px; }
        .thyratron { aspect-ratio: 1; background: #111; border: 1px solid #222; border-radius: 50%; transition: all 0.2s; }
        .thyratron.fired { background: var(--agg); border-color: var(--agg); box-shadow: 0 0 8px var(--agg); }
        
        /* Output */
        .output-viz { background: #000; border: 1px solid #222; border-radius: 4px; padding: 16px; font-family: 'Courier Prime', monospace; font-size: 0.8rem; min-height: 100px; }
        .output-line { padding: 4px 0; border-bottom: 1px solid #111; color: #666; }
        .output-line.buy { color: var(--accent); font-weight: bold; }
        .output-line.neutron { color: var(--calc0); }
        .output-line.crit { color: var(--calc1); }
        .output-line.art { color: var(--agg); }
        
        /* Code snippet */
        .code-block { background: #000; border: 1px solid #222; border-radius: 6px; padding: 16px; font-family: 'Courier Prime', monospace; font-size: 0.75rem; overflow-x: auto; color: #888; }
        .code-block .kw { color: var(--info); }
        .code-block .fn { color: var(--calc1); }
        .code-block .str { color: var(--calc2); }
        .code-block .num { color: var(--warn); }
        .code-block .comment { color: #555; }
        
        /* Navigation */
        .nav { display: flex; justify-content: space-between; margin-top: 60px; padding-top: 40px; border-top: 1px solid var(--border); }
        .nav-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 14px 28px; border-radius: 8px; font-family: 'Inter', sans-serif; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        .nav-btn:hover { border-color: var(--accent); background: #1a1a1a; }
        .nav-btn.primary { background: var(--accent); color: #000; border-color: var(--accent); }
        .nav-btn.primary:hover { background: var(--accent-dim); }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        /* Mode Selector */
        .mode-selector { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
        .mode-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 24px; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 140px; }
        .mode-btn:hover { border-color: var(--accent); }
        .mode-btn.active { border-color: var(--accent); background: #0a1a0a; }
        .mode-btn .icon { font-size: 1.5rem; }
        .mode-btn .label { font-family: 'Courier Prime', monospace; font-size: 0.75rem; color: var(--muted); }
        .mode-btn.active .label { color: var(--accent); }
        
        /* Legend */
        .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); font-size: 0.75rem; color: var(--muted); }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-box { width: 14px; height: 14px; border: 1px solid #333; border-radius: 2px; }
        .legend-box.calc0 { border-color: var(--calc0); background: rgba(77,166,255,0.1); }
        .legend-box.calc1 { border-color: var(--calc1); background: rgba(0,255,65,0.1); }
        .legend-box.calc2 { border-color: var(--calc2); background: rgba(255,204,0,0.1); }
        .legend-box.agg { border-color: var(--agg); background: rgba(255,0,255,0.1); }
        .legend-box.grid { background: #1a1a1a; border-color: #333; }
        .legend-box.signal { background: #003300; border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="progress" id="progress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-labels" id="progressLabels"></div>
    </div>
    
    <div class="container">
        <header>
            <h1>STELLAR ARRAY</h1>
            <p>How a 1946 vacuum-tube computer processes a 15×15 grid using striped parallelism — explained step by step</p>
        </header>
        
        <div class="mode-selector" id="modeSelector">
            <button class="mode-btn active" data-mode="trading"><span class="icon">📈</span><span class="label">Trading Arbitrage</span></button>
            <button class="mode-btn" data-mode="aec"><span class="icon">☢️</span><span class="label">AEC Neutron Flux</span></button>
            <button class="mode-btn" data-mode="cea"><span class="icon">🏭</span><span class="label">CEA Criticality</span></button>
            <button class="mode-btn" data-mode="art"><span class="icon">🎨</span><span class="label">Fractal Art</span></button>
        </div>
        
        <!-- Steps will be injected here -->
        <div id="steps"></div>
        
        <nav class="nav">
            <button class="nav-btn" id="prevBtn" disabled>← Previous</button>
            <button class="nav-btn primary" id="nextBtn">Next →</button>
        </nav>
    </div>

<script>
// ============================================
// COMPUTATION MODES WITH PRE-COMPUTED EXAMPLES
// ============================================
const MODES = {
    trading: {
        name: "Trading Arbitrage",
        icon: "📈",
        description: "Detect price spreads between NYSE and Curb Exchange. Buy when spread > 5.",
        // Pre-generated example data (deterministic for tutorial)
        tapeA: [
            {idx:0, val:42, label:"A-000"}, {idx:1, val:38, label:"A-001"}, {idx:2, val:45, label:"A-002"},
            {idx:3, val:41, label:"A-003"}, {idx:4, val:39, label:"A-004"}, {idx:5, val:44, label:"A-005"},
            {idx:6, val:40, label:"A-006"}, {idx:7, val:43, label:"A-007"}, {idx:8, val:37, label:"A-008"},
            {idx:9, val:46, label:"A-009"}, {idx:10, val:42, label:"A-010"}, {idx:11, val:39, label:"A-011"},
            {idx:12, val:44, label:"A-012"}, {idx:13, val:40, label:"A-013"}, {idx:14, val:45, label:"A-014"},
            {idx:15, val:38, label:"A-015"}, {idx:16, val:41, label:"A-016"}, {idx:17, val:43, label:"A-017"},
            {idx:18, val:39, label:"A-018"}, {idx:19, val:44, label:"A-019"}, {idx:20, val:37, label:"A-020"},
            {idx:21, val:46, label:"A-021"}, {idx:22, val:42, label:"A-022"}, {idx:23, val:39, label:"A-023"},
            {idx:24, val:44, label:"A-024"}, {idx:25, val:40, label:"A-025"}, {idx:26, val:45, label:"A-026"},
            {idx:27, val:38, label:"A-027"}, {idx:28, val:41, label:"A-028"}, {idx:29, val:43, label:"A-029"},
            // ... abbreviated for brevity, we'll show key ones
        ],
        tapeB: [
            {idx:0, val:54, label:"B-000", spread:12},  // BUY signal!
            {idx:1, val:39, label:"B-001", spread:1},
            {idx:2, val:46, label:"B-002", spread:1},
            {idx:3, val:42, label:"B-003", spread:1},
            {idx:4, val:40, label:"B-004", spread:1},
            {idx:5, val:55, label:"B-005", spread:11}, // BUY signal!
            {idx:6, val:41, label:"B-006", spread:1},
            {idx:7, val:44, label:"B-007", spread:1},
            {idx:8, val:38, label:"B-008", spread:1},
            {idx:9, val:58, label:"B-009", spread:12}, // BUY signal!
            {idx:10, val:43, label:"B-010", spread:1},
            {idx:11, val:40, label:"B-011", spread:1},
            {idx:12, val:45, label:"B-012", spread:1},
            {idx:13, val:41, label:"B-013", spread:1},
            {idx:14, val:52, label:"B-014", spread:7},  // BUY signal!
        ],
        compute: (curr, base) => curr - base,
        threshold: 5,
        signalLabel: "BUY",
        signalClass: "buy",
        sampleIdx: 0,  // We'll focus on index 0 (spread +12)
    },
    aec: {
        name: "AEC Neutron Flux",
        icon: "☢️",
        description: "Calculate neutron multiplication factor k for reactor design at Los Alamos.",
        tapeA: [
            {idx:0, val:85, label:"A-000"}, {idx:1, val:82, label:"A-001"}, {idx:2, val:88, label:"A-002"},
            {idx:3, val:84, label:"A-003"}, {idx:4, val:86, label:"A-004"}, {idx:5, val:83, label:"A-005"},
        ],
        tapeB: [
            {idx:0, val:98, label:"B-000", spread:13},  // FLUX signal!
            {idx:1, val:83, label:"B-001", spread:1},
            {idx:2, val:89, label:"B-002", spread:1},
            {idx:3, val:85, label:"B-003", spread:1},
            {idx:4, val:87, label:"B-004", spread:1},
            {idx:5, val:95, label:"B-005", spread:12},  // FLUX signal!
        ],
        compute: (curr, base) => curr - base,
        threshold: 10,
        signalLabel: "FLUX",
        signalClass: "neutron",
        sampleIdx: 0,
    },
    cea: {
        name: "CEA Reactor Criticality",
        icon: "🏭",
        description: "Monitor temperature/pressure grid for reactor safety margins.",
        tapeA: [
            {idx:0, val:450, label:"A-000"}, {idx:1, val:445, label:"A-001"}, {idx:2, val:452, label:"A-002"},
            {idx:3, val:448, label:"A-003"}, {idx:4, val:451, label:"A-004"}, {idx:5, val:447, label:"A-005"},
        ],
        tapeB: [
            {idx:0, val:470, label:"B-000", spread:20},  // CRIT signal!
            {idx:1, val:446, label:"B-001", spread:1},
            {idx:2, val:453, label:"B-002", spread:1},
            {idx:3, val:449, label:"B-003", spread:1},
            {idx:4, val:452, label:"B-004", spread:1},
            {idx:5, val:468, label:"B-005", spread:21},  // CRIT signal!
        ],
        compute: (curr, base) => Math.abs(curr - base),
        threshold: 15,
        signalLabel: "CRIT",
        signalClass: "crit",
        sampleIdx: 0,
    },
    art: {
        name: "Fractal Art Generation",
        icon: "🎨",
        description: "Generate sine-wave interference patterns for MoMA exhibition.",
        tapeA: [
            {idx:0, val:45, label:"A-000"}, {idx:1, val:90, label:"A-001"}, {idx:2, val:135, label:"A-002"},
            {idx:3, val:180, label:"A-003"}, {idx:4, val:225, label:"A-004"}, {idx:5, val:270, label:"A-005"},
        ],
        tapeB: [
            {idx:0, val:135, label:"B-000", spread:90},   // DRAW signal!
            {idx:1, val:95, label:"B-001", spread:5},
            {idx:2, val:140, label:"B-002", spread:5},
            {idx:3, val:185, label:"B-003", spread:5},
            {idx:4, val:230, label:"B-004", spread:5},
            {idx:5, val:360, label:"B-005", spread:90},   // DRAW signal!
        ],
        compute: (curr, base) => Math.sin((curr - base) * Math.PI / 180) * 180,
        threshold: 90,
        signalLabel: "DRAW",
        signalClass: "art",
        sampleIdx: 0,
    }
};

// ============================================
// STEP DEFINITIONS
// ============================================
const STEPS = [
    {
        id: "overview",
        number: "01",
        title: "THE BIG PICTURE",
        phase: "OVERVIEW",
        explanation: `
            <p>The Stellar Array is a <strong>1946 vacuum-tube computer</strong> designed for one job: process a 15×15 grid of numbers all at once.</p>
            <div class="key-point"><strong>Why it's special:</strong> No CPU, no RAM, no software. Just 700 vacuum tubes hard-wired to read punched tape, do math in parallel, and light up Nixie tubes.</div>
            <p><strong>The problem:</strong> You have 225 numbers arriving on tape. You need to compare each against a stored baseline and flag any that exceed a threshold.</p>
            <p><strong>The solution:</strong> Strip the grid across 3 parallel calculators. Each handles 5 rows (75 cells). They all work simultaneously — 3× faster than a single processor.</p>
            <ul>
                <li><strong>Input:</strong> Punched tape at 100 bits/sec (~18 sec per block)</li>
                <li><strong>Memory:</strong> 464 flip-flops (3,712 bits) holding the 15×15 baseline grid</li>
                <li><strong>Compute:</strong> 3 calculators × 166 tubes each, doing subtraction in ~4ms</li>
                <li><strong>Aggregate:</strong> Calculator 3 (200 tubes) scans 225 thyratrons in ~22 sec</li>
                <li><strong>Output:</strong> Nixie tubes (instant) or punched cards</li>
            </ul>
        `,
        visual: "architecture"
    },
    {
        id: "tape",
        number: "02",
        title: "STEP 1: THE PUNCHED TAPE",
        phase: "PHASE 1 — INGEST",
        explanation: `
            <p>The machine has <strong>no keyboard, no disk, no network</strong>. Data enters only via punched paper tape.</p>
            <div class="key-point"><strong>Two blocks:</strong> Block A (Baseline) loads first and gets memorized. Block B (Current) streams through and is <em>immediately subtracted</em> from memory — never stored.</div>
            <p>Each block = 225 values × 8 bits = 1,800 bits. At 100 bits/sec, reading takes ~18 seconds.</p>
            <p><strong>Tape format:</strong> Each row has a label (A-000, A-001...) and an 8-bit value (0-255).</p>
            <p>For our <strong>${MODES.trading.name}</strong> example: Block A holds opening prices. Block B holds current prices. We're hunting for spreads > 5.</p>
        `,
        visual: "tape"
    },
    {
        id: "routing",
        number: "03",
        title: "STEP 2: THE STRIPING ROUTER",
        phase: "PHASE 1 — INGEST",
        explanation: `
            <p>When a value arrives, the <strong>Striping Router</strong> looks at its grid row and activates <strong>exactly one calculator</strong>:</p>
            <ul>

// RENDERING

let currentMode = 'trading';
let currentStep = 0;

const stepsContainer = document.getElementById('steps');
const progressFill = document.getElementById('progressFill');
const progressLabels = document.getElementById('progressLabels');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const modeSelector = document.getElementById('modeSelector');

function renderSteps() {
    const mode = MODES[currentMode];
    stepsContainer.innerHTML = STEPS.map((step, i) => `
        <article class="step" id="step-${step.id}" data-index="${i}">
            <header class="step-header">
                <span class="step-number">${step.number}</span>
                <h2 class="step-title">${step.title}</h2>
                <span class="step-phase">${step.phase}</span>
            </header>
            <div class="step-content">
                <div class="explanation">${step.explanation.replace(/\$\{MODES\.trading\.name\}/g, mode.name)}</div>
                <div class="visual-panel" id="viz-${step.id}-${i}">${renderVisual(step.visual, mode, i)}</div>
            </div>
        </article>
    `).join('');
    
    // Progress labels
    progressLabels.innerHTML = STEPS.map((s, i) => 
        `<span class="${i === 0 ? 'active' : ''}">${s.number}. ${s.title.split(' ').slice(0,3).join(' ')}</span>`
    ).join('');
}

            `;
        default:
            return '<div style="color:var(--muted);">Visualization not implemented</div>';
    }
}

function updateProgress() {
    const pct = ((currentStep) / (STEPS.length - 1)) * 100;
    progressFill.style.width = `${pct}%`;
    document.querySelectorAll('.progress-labels span').forEach((el, i) => {
        el.classList.toggle('active', i === currentStep);
    });
}

function showStep(index) {
    currentStep = Math.max(0, Math.min(index, STEPS.length - 1));
    document.querySelectorAll('.step').forEach((el, i) => {
        el.style.display = i === currentStep ? 'block' : 'none';
    });
    prevBtn.disabled = currentStep === 0;
    nextBtn.disabled = currentStep >= STEPS.length - 1;
    nextBtn.textContent = currentStep >= STEPS.length - 1 ? 'Done' : 'Next →';
    updateProgress();
    window.scrollTo({top: 0, behavior: 'smooth'});
}

// ============================================
// EVENT LISTENERS
// ============================================
prevBtn.addEventListener('click', () => showStep(currentStep - 1));
nextBtn.addEventListener('click', () => {
    if (currentStep < STEPS.length - 1) showStep(currentStep + 1);
});

modeSelector.addEventListener('click', (e) => {
    const btn = e.target.closest('.mode-btn');
    if (!btn) return;
    currentMode = btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderSteps();
    showStep(0);
});

// Keyboard navigation
document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextBtn.click(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); prevBtn.click(); }
});

// Initialize
renderSteps();
showStep(0);
</script>
</body>
</html>
